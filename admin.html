<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Панель адміністратора | MebliVam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-black/90 flex flex-col items-center justify-center p-4">

    <div id="auth-section" class="mb-8 min-h-[40px] flex items-center justify-center w-full"></div>

    <div class="bg-zinc-900 border border-amber-500/30 w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl shadow-amber-500/20">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-white text-xl font-black uppercase italic tracking-tighter">Нова публікація</h2>
            <a href="index.html" class="text-amber-500 hover:text-amber-400 transition-colors text-xs uppercase font-bold tracking-widest"><i class="fas fa-arrow-left mr-2"></i>На сайт</a>
        </div>
        <form id="post-form" class="space-y-4">
            <div>
                <label class="text-[10px] text-amber-500 font-black uppercase mb-1 block">Оберіть розділ</label>
                <select id="post-page" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-xs outline-none focus:border-amber-500 transition-all uppercase font-bold cursor-pointer">
                    <option value="kuhni">🍳 Кухні</option>
                    <option value="spalnya">🛌 Спальні</option>
                    <option value="peredpokii">🚪 Передпокої</option>
                    <option value="vitalni">📺 Вітальні</option>
                    <option value="shafy">🧥 Шафи</option>
                    <option value="garderobni">👔 Гардеробні</option>
                    <option value="dytyachi">🧸 Дитячі</option>
                    <option value="sanvuzol">🚿 Санвузли</option>
                </select>
            </div>
            <input type="text" id="post-title" placeholder="НАЗВА ПРОЄКТУ" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-xs outline-none focus:border-amber-500 transition-all uppercase font-bold">
            <textarea id="post-desc" placeholder="ОПИС ОБ'ЄКТА" required rows="4" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-xs outline-none focus:border-amber-500 transition-all uppercase font-light leading-relaxed"></textarea>
            <div class="relative group">
                <input type="file" id="post-image" accept="image/*" required class="hidden">
                <label for="post-image" class="flex items-center justify-center gap-3 w-full bg-white/5 border-2 border-dashed border-white/10 rounded-xl px-4 py-6 text-slate-400 text-[10px] font-black uppercase cursor-pointer hover:bg-white/10 hover:border-amber-500/50 transition-all">
                    <i class="fas fa-cloud-upload-alt text-xl text-amber-500"></i>
                    <span id="post-file-name">Обрати фото об'єкта</span>
                </label>
            </div>
            <button type="submit" id="post-submit-btn" class="w-full bg-amber-500 hover:bg-amber-400 py-4 rounded-xl text-black font-black uppercase italic tracking-tighter transition-all shadow-lg shadow-amber-500/20 mt-4">Опублікувати на сайті</button>
        </form>
    </div>

    <script type="module" src="js/reviews.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/ads-control.js"></script>
</body>
</html>
