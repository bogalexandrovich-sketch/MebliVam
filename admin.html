<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Панель адміністратора | MebliVam</title>

    <style>
        body { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6cfj0rKRz2B_MgPrELJe8sFav942TrF0",
            authDomain: "meblivam-pp-ua.firebaseapp.com",
            projectId: "meblivam-pp-ua",
            storageBucket: "meblivam-pp-ua.firebasestorage.app",
            messagingSenderId: "212919546702",
            appId: "1:212919546702:web:589648b3f42f75e539641f",
            measurementId: "G-BM1W93R3X7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            const adminEmail = 'alphacentavr.2012@gmail.com';

            if (user && user.email === adminEmail) {
                document.body.style.display = 'block';
            } else if (user) {
                alert("Доступ заборонено: ви не власник.");
                signOut(auth).then(() => window.location.href = 'index.html');
            } else {
                // Якщо не залогінений, показуємо кнопку входу
                document.body.style.display = 'block';
                document.getElementById('auth-section').innerHTML = `
                    <button id="login-btn" class="bg-amber-500 text-black px-8 py-3 rounded-xl font-black uppercase italic tracking-tighter">
                        Увійти як Адмін
                    </button>
                `;
                document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
            }
        });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-black/90 flex flex-col items-center justify-center p-4">

    <div id="auth-section" class="mb-8 flex items-center justify-center w-full"></div>

    <div id="admin-content" class="bg-zinc-900 border border-amber-500/30 w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl shadow-amber-500/20">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-white text-xl font-black uppercase italic tracking-tighter">Нова публікація</h2>
            <a href="index.html" class="text-amber-500 hover:text-amber-400 transition-colors text-xs uppercase font-bold tracking-widest"><i class="fas fa-arrow-left mr-2"></i>На сайт</a>
        </div>
        <form id="post-form" class="space-y-4">
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 py-4 rounded-xl text-black font-black uppercase italic tracking-tighter transition-all shadow-lg shadow-amber-500/20 mt-4">Опублікувати</button>
        </form>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/reviews.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/ads-control.js"></script>
</body>
</html>
