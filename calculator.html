<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇺🇦 Калькулятор вартості меблів | MebliVam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2318181b%22/><text x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial, sans-serif%22 font-weight=%22900%22 font-style=%22italic%22 font-size=%2265%22 fill=%22%23f59e0b%22>M</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden bg-slate-950">

    <main class="flex-grow max-w-3xl mx-auto px-4 py-16 w-full">
        <header class="mb-12 border-l-4 border-amber-500 pl-6">
            <h2 class="text-4xl md:text-6xl font-black text-white uppercase italic tracking-tighter">Розрахунок вартості</h2>
            <p class="text-slate-500 mt-4 text-xs font-light uppercase tracking-widest">Орієнтовний прорахунок за 1 хвилину</p>
        </header>

        <form id="furniture-calc-form" class="space-y-8 bg-slate-900/40 border border-white/5 p-8 md:p-12 rounded-[2.5rem] shadow-2xl" onsubmit="event.preventDefault();">

            <div class="mb-8">
                <label class="block text-white text-[11px] font-black uppercase tracking-widest mb-4">Оберіть тип меблів</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button type="button" class="calc-cat-btn bg-amber-500 text-slate-950 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all">Кухня</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Шафа</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Вітальня</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Дитяча</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Передпокій</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Спальня</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Сан. Вузол</button>
                    <button type="button" class="calc-cat-btn bg-slate-950/60 border border-white/10 text-slate-400 p-4 rounded-2xl text-[10px] font-bold uppercase transition-all hover:border-amber-500/30">Гардеробна</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-white text-[11px] font-black uppercase mb-3">Довжина (м.п.)</label>
                    <input type="number" id="calc-length" step="0.1" value="1" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-5 py-4 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-white text-[11px] font-black uppercase mb-3">Розмір стільниці (мм, 800-7000)</label>
                    <input type="number" id="calc-countertop" min="800" max="7000" value="800" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-5 py-4 text-sm outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-white text-[11px] font-black uppercase mb-3">Матеріал фасадів</label>
                    <select id="calc-facade" class="w-full bg-slate-950/80 text-white border border-white/10 rounded-2xl px-5 py-4 text-sm appearance-none cursor-pointer">
                        <option value="dsp">ДСП</option>
                        <option value="dsp-pur">ДСП ПУР</option>
                        <option value="mdf-film">МДФ плівка</option>
                        <option value="mdf-paint">МДФ фарбований</option>
                        <option value="mdf-milled">МДФ фарбований фрезований</option>
                        <option value="mdf-veneer">МДФ шпон</option>
                    </select>
                </div>
                <div>
                    <label class="block text-white text-[11px] font-black uppercase mb-3">Матеріал стільниці</label>
                    <select id="calc-countertop-material" class="w-full bg-slate-950/80 text-white border border-white/10 rounded-2xl px-5 py-4 text-sm appearance-none cursor-pointer">
                        <option value="dsp28">ДСП 28 мм</option>
                        <option value="dsp38">ДСП 38 мм</option>
                        <option value="compact12">Компакт плита (Fundermax/Egger)</option>
                        <option value="fenix">Компакт плита (Arpa/Fenix PREM)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-white text-[11px] font-black uppercase mb-3">Бренд фурнітури</label>
                <select id="calc-hardware" class="w-full bg-slate-950/80 text-white border border-white/10 rounded-2xl px-5 py-4 text-sm appearance-none cursor-pointer">
                    <option value="giff">Giff Prime</option>
                    <option value="muller">Muller</option>
                    <option value="blum">Blum (Австрія)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="calc-upper-cabinets" placeholder="Верхні тумби (3-25)" min="3" max="25" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
                <input type="number" id="calc-lower-cabinets" placeholder="Нижні тумби (3-20)" min="3" max="20" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="calc-doors" placeholder="К-сть дверей" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
                <input type="number" id="calc-drawers" placeholder="К-сть шухляд" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="calc-facade-height" placeholder="Висота нижнього фасаду (мм)" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
                <input type="number" id="calc-facade-width" placeholder="Висота верхнього фасаду (мм)" class="w-full bg-slate-950/60 text-white border border-white/10 rounded-2xl px-4 py-3 text-sm">
            </div>

            <div class="p-6 bg-amber-500/5 border border-amber-500/20 rounded-2xl text-center">
                <span id="calc-price-output" class="text-3xl font-black text-amber-500 italic">0 грн</span>
            </div>

            <div class="p-4 bg-slate-900/40 border border-white/5 rounded-2xl">
                <p class="text-slate-400 text-[10px] uppercase italic">⚠ Цей калькулятор створений для примітивного прорахунку Вашої майбутньої кухні за заданими параметрами. Остаточна ціна — після заміру, вибору матеріалів, фурнітури та проєктування.</p>
            </div>

            <button type="button" id="calc-submit-btn" class="w-full py-5 bg-amber-500 text-slate-950 font-black rounded-2xl uppercase tracking-[0.2em] hover:bg-white transition-all cursor-pointer">
                Розрахувати вартість
            </button>
        </form>
    </main>

    <script src="js/calculator.js"></script>
</body>
</html>
